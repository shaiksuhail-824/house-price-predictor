<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>
    <style>
        :root {
            --primary-color: #4C72B0;
            --accent-color: #2d6a4f;
            --glass-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Replace the URL below with your preferred house image */
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url('https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=1600&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .container {
            background: var(--glass-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            margin: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Span full width for specific items */
        .full-width { grid-column: span 2; }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 5px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        input:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 8px rgba(76, 114, 176, 0.2);
        }

        button {
            width: 100%;
            background: var(--primary-color);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #3a5a8f;
        }

        .result-container {
            margin-top: 25px;
            padding: 20px;
            background: #e8f5e9;
            border-left: 5px solid var(--accent-color);
            border-radius: 8px;
            text-align: center;
        }

        .result-label {
            font-size: 16px;
            color: #666;
            margin-bottom: 5px;
        }

        .result-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🏠 House Price Predictor</h2>
        
        <form action="/predict" method="POST">
            <div class="form-grid">
                <div class="full-width">
                    <label>Overall Quality (1-10)</label>
                    <input type="number" name="OverallQual" min="1" max="10" placeholder="e.g. 7" required>
                </div>

                <div>
                    <label>Gr. Living Area (sq ft)</label>
                    <input type="number" name="GrLivArea" placeholder="e.g. 1500" required>
                </div>

                <div>
                    <label>Lot Area (sq ft)</label>
                    <input type="number" name="LotArea" placeholder="e.g. 5000" required>
                </div>

                <div>
                    <label>Garage Cars</label>
                    <input type="number" name="GarageCars" min="0" max="5" placeholder="0-5" required>
                </div>

                <div>
                    <label>Full Bathrooms</label>
                    <input type="number" name="FullBath" min="0" max="5" placeholder="0-5" required>
                </div>

                <div>
                    <label>Total Bsmt (sq ft)</label>
                    <input type="number" name="TotalBsmtSF" placeholder="e.g. 800" required>
                </div>

                <div>
                    <label>Year Built</label>
                    <input type="number" name="YearBuilt" min="1800" max="2026" placeholder="YYYY" required>
                </div>
            </div>

            <button type="submit">Calculate Valuation</button>
        </form>

        {% if prediction %}
        <div class="result-container">
            <div class="result-label">Estimated Market Price</div>
            <div class="result-value">{{ prediction }}</div>
        </div>
        {% endif %}
    </div>

</body>
</html>
